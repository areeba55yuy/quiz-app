
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <div class="auth-box">
        <h1>CREATE ACCOUNT</h1>
        <p class="subtitle">Sign up to start your quiz journey.</p>

        <form id="signup-form">
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Create a password (at least 6 characters)"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <button type="submit" class="main-btn" id="signup-btn">
                SIGN UP
            </button>
        </form>

        <div class="separator">OR</div>

        <button type="button" class="google-btn" id="google-signup">
        <i class="fa-brands fa-google fa-2xl" style="color: rgb(194, 42, 170);"></i>
            Continue with Google
        </button>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="switch-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="signup.js"></script>
</body>
</html>
